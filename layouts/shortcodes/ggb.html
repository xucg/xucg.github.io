{{- $height := .Get "height" | default "550" -}}
{{- $width := .Get "width" | default "100%" -}}
<div class="ggb-embed" style="width:100%;">
  <iframe
    class="ggb-frame"
    src="{{ .Get "src" }}"
    width="{{ $width }}"
    height="{{ $height }}"
    style="width:100%;max-width:100%;border:0;display:block;"
    frameborder="0"
    allowfullscreen
    loading="lazy"
    sandbox="allow-same-origin allow-scripts allow-popups allow-forms"
    data-ggb
  ></iframe>
</div>
{{- if not ($.Page.Scratch.Get "ggbScript") -}}
{{- $.Page.Scratch.Set "ggbScript" true -}}
<script>
(function () {
  if (window.__ggbAutoResize) return;
  window.__ggbAutoResize = true;
  function resize(iframe) {
    try {
      var d = iframe.contentDocument || (iframe.contentWindow && iframe.contentWindow.document);
      if (!d || !d.body) return;
      var h = Math.max(
        d.body.scrollHeight, d.documentElement.scrollHeight,
        d.body.offsetHeight, d.documentElement.offsetHeight
      );
      if (h > 0) iframe.style.height = h + 'px';
    } catch (e) { /* 跨域时无法读取，依赖 postMessage */ }
  }
  function poll(iframe) {
    resize(iframe);
    [300, 1000, 2500].forEach(function (t) {
      setTimeout(function () { resize(iframe); }, t);
    });
  }
  function init() {
    document.querySelectorAll('iframe[data-ggb]').forEach(function (iframe) {
      poll(iframe);
      iframe.addEventListener('load', function () { poll(iframe); });
    });
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
  // GeoGebra 通过 postMessage 上报高度时自动应用
  window.addEventListener('message', function (e) {
    var msg = e.data;
    if (!msg || (msg.type !== 'height' && msg.type !== 'ggb-height' && typeof msg.height !== 'number')) return;
    var h = msg.height;
    document.querySelectorAll('iframe[data-ggb]').forEach(function (iframe) {
      if (e.source === (iframe.contentWindow || (iframe.contentDocument && iframe.contentDocument.defaultView))) {
        iframe.style.height = h + 'px';
      }
    });
  });
})();
</script>
{{- end -}}
