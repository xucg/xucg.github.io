# -- Markup --
# Blowfish 内置 KaTeX，同时保留 goldmark passthrough 兼容性

[goldmark]
  [goldmark.parser]
    wrapStandAloneImageWithinParagraph = false

    [goldmark.parser.attribute]
      block = true

  [goldmark.renderer]
    unsafe = true

  [goldmark.extensions]
    [goldmark.extensions.passthrough]
      enable = true
      [goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)'], ['$', '$']]

[highlight]
  noClasses = false

[tableOfContents]
  startLevel = 2
  endLevel = 4
