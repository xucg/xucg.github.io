# -- Site Configuration --
# 主题通过 Hugo Modules (go.mod) 引入，并显式声明为 theme 层以挂载其 layouts/static/assets
theme = ["github.com/nunocoracao/blowfish/v2"]
baseURL = '/'
defaultContentLanguage = 'zh'
locale = 'zh-cn'

enableRobotsTXT = true
summaryLength = 70

buildDrafts = false
buildFuture = false
buildExpired = false

enableEmoji = true

[pagination]
  pagerSize = 10

[imaging]
  anchor = 'Center'

[taxonomies]
  tag = 'tags'
  category = 'categories'
  author = 'authors'
  series = 'series'

[sitemap]
  changefreq = 'daily'
  filename = 'sitemap.xml'
  priority = 0.5

[outputs]
  home = ["HTML", "RSS", "JSON"]

[related]
  threshold = 0
  toLower = false

  [[related.indices]]
    name = 'tags'
    weight = 100

  [[related.indices]]
    name = 'categories'
    weight = 100

  [[related.indices]]
    name = 'series'
    weight = 50

  [[related.indices]]
    name = 'authors'
    weight = 20

  [[related.indices]]
    name = 'date'
    weight = 10

  [[related.indices]]
    applyFilter = false
    name = 'fragmentrefs'
    type = 'fragments'
    weight = 10
